# docker-compose.local-verify.yml
#
# Runs the production container topology (the poller and every api replica) on
# a laptop, to check that the build serves correctly before a dev → main deploy.
# Combine it with the base file:
#
#   npm run verify:serve        # build and start, detached
#   npm run verify:serve:down   # tear down
#
# NODE_ENV stays production; only the data plane and the outbound side effects
# are switched off.
#
# Why production rather than development: the image is built with
# `npm ci --omit=dev`, so pino-pretty is absent, and the logger needs it outside
# production (src/infra/logger.ts) — a development boot of this image fails.
# Production mode is also the behavior being verified (JSON logs,
# USE_PROD_API forced).
#
# Databases: in production mode dbNameFor() is a no-op, so every database name
# the server writes is overridden to its _dev name here — bus_campus,
# skkumap, skku_notices, eventmap, miniapps, and skku_content, which the
# api reads the datasets from (docs/decisions/0013-runtime-data-in-mongodb.md).
# A new database must be
# added here too: env_file .env injects the production names, and one left out
# is written to in production. eventmap was in exactly that state once
# (skkuverse#14).
#
# Side effects (src/infra/runtime-switches.ts):
#   - PUSH_DELIVERY=suppressed: every push — the notices sweep, POST
#     /internal/notices/dispatch-pending, a mini-app send — is logged instead of
#     sent. The laptop's .env points at the same Cloud Function production uses,
#     and it pushes by topic to every real subscriber.
#   - SHUTTLE_ETA=off: no NAVER Directions or TMAP call, which use metered
#     keys and would write estimates into bus_campus_dev.
#   - SUBWAY=off: no Seoul subway API call or train-map crawl, which share a
#     daily quota with production.
#   - REGIONAL_BUS=off: no TOPIS call for the regional routes (7800), whose
#     daily quota production shares, leaving 6,752 arrival calls a day.
#   - GBIS=off: no GBIS call for 7800's seats, whose 1,000-call daily quota
#     production spends most of.
#   - NOTICE_OVERVIEW=off on the api replicas: no skkuverse-ai call for a
#     notice search overview, each one a paid LLM call.
#   - DISPATCH_SWEEP_ENABLED=false on the poller: the base file sets it true;
#     with push suppressed the sweep would only mark _dev notices pushed.
#   - SENTRY_DSN=disabled: production requires a DSN, and a local run must not
#     report into prod's project.
# __tests__/nest/infra/runtime-switches.test.ts fails if a block loses one.

# Every api replica gets the same _dev overrides. A replica missing from this
# file would boot with the production database names from .env —
# __tests__/nest/infra/replica-topology.test.ts fails if one is missing.
x-api-dev-env: &api-dev-env
  - NODE_ENV=production
  - ROLE=api
  - TZ=Asia/Seoul
  - PERIMETER_MODE=overlay
  - HOST=0.0.0.0
  - MONGO_DB_NAME_BUS_CAMPUS=bus_campus_dev
  - MONGO_BUILDING_DB_NAME=skkumap_dev
  - MONGO_NOTICES_DB_NAME=skku_notices_dev
  - MONGO_EVENTMAP_DB_NAME=eventmap_dev
  - MONGO_MINIAPPS_DB_NAME=miniapps_dev
  - MONGO_CONTENT_DB_NAME=skku_content_dev
  - SENTRY_DSN=disabled
  - PUSH_DELIVERY=suppressed
  - SHUTTLE_ETA=off
  - SUBWAY=off
  - REGIONAL_BUS=off
  - GBIS=off
  - NOTICE_OVERVIEW=off

services:
  poller:
    environment:
      - NODE_ENV=production
      - ROLE=poller
      - TZ=Asia/Seoul
      - PERIMETER_MODE=overlay
      - DISPATCH_SWEEP_ENABLED=false
      - MONGO_DB_NAME_BUS_CAMPUS=bus_campus_dev
      - MONGO_BUILDING_DB_NAME=skkumap_dev
      - MONGO_NOTICES_DB_NAME=skku_notices_dev
      - MONGO_EVENTMAP_DB_NAME=eventmap_dev
      - MONGO_MINIAPPS_DB_NAME=miniapps_dev
      - MONGO_CONTENT_DB_NAME=skku_content_dev
      - SENTRY_DSN=disabled
      - PUSH_DELIVERY=suppressed
      - SHUTTLE_ETA=off
      - SUBWAY=off
      - REGIONAL_BUS=off
      - GBIS=off

  api-1:
    environment: *api-dev-env

  api-2:
    environment: *api-dev-env

  api-3:
    environment: *api-dev-env
