# docker-compose.local-verify.yml
#
# Override that runs the production container topology (the poller + every api
# replica) locally, to check that the server serves correctly once deployed.
# Combine it with the base docker-compose.yml via -f:
#
#   npm run verify:serve        # start (detached + build)
#   npm run verify:serve:down   # tear down
#
# ──────────────────────────────────────────────────────────────────────────
# Design: keep NODE_ENV=production and switch only the DB *names* to _dev.
# ──────────────────────────────────────────────────────────────────────────
# Why production and not development:
#   the prod image is built with `npm ci --omit=dev` (Dockerfile), so the
#   devDependency pino-pretty is not in it, and src/infra/logger.ts
#   (buildTransport) asks for the pino-pretty transport outside production and
#   test. The prod image started with NODE_ENV=development fails to boot with
#   "unable to determine transport target for pino-pretty". Keeping
#   NODE_ENV=production verifies the real prod behavior (JSON logging,
#   USE_PROD_API forced).
#
# DB isolation: in production mode config.devDbName() is a no-op, so the DB
# name env vars are overridden with _dev values directly. These are the six
# DBs we write:
#   bus_campus / skkubus_ads / skkumap / skku_notices / eventmap / miniapps
#   → each *_dev. The prod DBs are never touched.
#
# ⚠️ Add every new DB here too. env_file: .env injects the prod names and
# devDbName() is a no-op in production, so a missing one silently writes to the
# prod DB. eventmap was once in exactly that state (skkuverse#14).
#
# DISPATCH_SWEEP_ENABLED=false keeps the FCM dispatch sweep poller from
# registering (src/notices/notices-dispatch.poller.service.ts), so the local
# poller cannot push to real users. The base poller sets it to true, so it must
# be overridden.
#
# Result: the same runtime behavior as prod, with only the data plane on _dev.
#
# ⚠️ FCM has no _dev. With the sweep off nothing pushes on its own, but the
#    internal POST routes (/internal/notices/dispatch-pending,
#    /internal/miniapps/:id/notifications) still send real pushes to real
#    subscribers when called with the internal token.

# Every api replica gets the same _dev overrides. A replica missing from this
# file would boot with the production database names from .env —
# __tests__/nest/infra/replica-topology.test.ts fails if one is missing.
x-api-dev-env: &api-dev-env
  - NODE_ENV=production
  - ROLE=api
  - TZ=Asia/Seoul
  - MONGO_DB_NAME_BUS_CAMPUS=bus_campus_dev
  - MONGO_AD_DB_NAME=skkubus_ads_dev
  - MONGO_BUILDING_DB_NAME=skkumap_dev
  - MONGO_NOTICES_DB_NAME=skku_notices_dev
  - MONGO_EVENTMAP_DB_NAME=eventmap_dev
  - MONGO_MINIAPPS_DB_NAME=miniapps_dev
  # Production requires SENTRY_DSN; a local run must not report into prod's
  # project, so it is switched off by name (src/infra/config.ts).
  - SENTRY_DSN=disabled

services:
  poller:
    environment:
      - NODE_ENV=production
      - ROLE=poller
      - TZ=Asia/Seoul
      - DISPATCH_SWEEP_ENABLED=false
      - MONGO_DB_NAME_BUS_CAMPUS=bus_campus_dev
      - MONGO_AD_DB_NAME=skkubus_ads_dev
      - MONGO_BUILDING_DB_NAME=skkumap_dev
      - MONGO_NOTICES_DB_NAME=skku_notices_dev
      - MONGO_EVENTMAP_DB_NAME=eventmap_dev
      - MONGO_MINIAPPS_DB_NAME=miniapps_dev
      - SENTRY_DSN=disabled

  api-1:
    environment: *api-dev-env

  api-2:
    environment: *api-dev-env

  api-3:
    environment: *api-dev-env
