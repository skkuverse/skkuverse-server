# Every api replica is the same container on its own loopback port; only the
# port differs, so they share one definition. Adding a replica means a service
# here and an override in docker-compose.local-verify.yml
# (__tests__/nest/infra/replica-topology.test.ts fails until the two agree),
# plus a line in the host's nginx upstream, which is configured outside this
# repository and pinned to these ports. The deploy reads the replicas from this
# file: each api-N service with its "127.0.0.1:<port>:3000" mapping.
#
# Sizing: a Node process runs its JavaScript on one thread, so a replica gains
# nothing from more than one core; capacity comes from the number of replicas.
# The VM has 4 cores; three 1-core replicas leave about one core for the
# poller, crawler, AI service, OTA server and nginx. cpu_shares only matters
# under contention, where it lets the replicas win over those neighbours.
x-api: &api
  # GIT_SHA, PERIMETER_OVERLAY_DIR and PERIMETER_OVERLAY_SHA come from the deploy's shell; unset
  # locally, the build takes the empty overlay folder and labels the image `none`.
  build:
    context: .
    additional_contexts:
      perimeter-overlay: ${PERIMETER_OVERLAY_DIR:-./perimeter-overlay.empty}
    args:
      - GIT_SHA
      - PERIMETER_OVERLAY_SHA
  env_file:
    - .env
  environment:
    - NODE_ENV=production
    - ROLE=api
    - TZ=Asia/Seoul
    - PERIMETER_MODE=overlay
    - HOST=0.0.0.0
  depends_on:
    - poller
  restart: unless-stopped
  mem_limit: 384m
  cpus: 1.0
  cpu_shares: 2048
  networks:
    - skkuverse
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    # 127.0.0.1, not localhost: HOST=0.0.0.0 listens on IPv4 only, and localhost may resolve to ::1.
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health/ready"]
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3

services:
  poller:
    build:
      context: .
      additional_contexts:
        perimeter-overlay: ${PERIMETER_OVERLAY_DIR:-./perimeter-overlay.empty}
      args:
        - GIT_SHA
        - PERIMETER_OVERLAY_SHA
    # Every service sets its hostname so the `hostname` field of its log lines
    # names the service rather than a container id (src/infra/logger.ts).
    hostname: poller
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ROLE=poller
      - TZ=Asia/Seoul
      - PERIMETER_MODE=overlay
      # Safety-net cron for FCM dispatch — only the poller container runs it.
      # Primary trigger is the crawler's cycle-end ping to /internal/notices/dispatch-pending.
      - DISPATCH_SWEEP_ENABLED=true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks:
      - skkuverse
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-1:
    <<: *api
    hostname: api-1
    ports:
      - "127.0.0.1:3001:3000"

  api-2:
    <<: *api
    hostname: api-2
    ports:
      - "127.0.0.1:3002:3000"

  api-3:
    <<: *api
    hostname: api-3
    ports:
      - "127.0.0.1:3003:3000"

networks:
  skkuverse:
    external: true
