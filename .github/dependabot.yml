# Two lanes. github-actions: one grouped version-update pull request a month
# into dev, each pin rewritten with its new version comment. npm: security
# updates only, which GitHub opens against the default branch (main) whatever
# `target-branch` says, so that entry sets none; version updates stay off
# because dependencies are bumped one package per change by hand (CLAUDE.md).
# The nestjs group exists because the four @nestjs/* packages must move
# together: a lone @nestjs/platform-express bump failed with ERESOLVE.
# docs/cicd-and-branch-protection.md has the merge rules.
# __tests__/nest/infra/workflow-pins.test.ts pins this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      nestjs:
        applies-to: security-updates
        patterns:
          - "@nestjs/*"
