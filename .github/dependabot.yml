# Keeps the SHA-pinned actions current: one grouped pull request a month for
# every `uses:` in .github/workflows/, each pin rewritten with its new version
# comment. npm is left out on purpose: dependencies are bumped one package per
# change by hand (CLAUDE.md). __tests__/nest/infra/workflow-pins.test.ts pins
# this file and the SHA pins it maintains.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
