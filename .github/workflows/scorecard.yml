name: Scorecard

# WHY: OpenSSF Scorecard reads this repository's own settings and workflows (token permissions, pinned actions,
# branch rules and more) and reports each finding to the Security tab. publish_results is false, so no result
# leaves the repository: the job needs no OIDC token, and the default token is all it uses.
on:
  # QUIRK(ossf/scorecard-action): only the default branch is supported.
  push:
    branches: [main]
  schedule:
    - cron: '17 22 * * 6'   # Sunday 07:17 KST
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    # WHY: security-events uploads the SARIF file to code scanning, and contents is the checkout. Scorecard's
    # README asks for more reads only on a private repository.
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
