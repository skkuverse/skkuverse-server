name: CI

# The checks themselves are `npm run check:ci` (scripts/check-ci.sh), which local hooks run too. The shared workflow
# installs, runs it, lints the workflows and reviews new dependencies; the ruleset requires its `ci / gate`.
# WHY: a push to dev runs too, because work lands on dev directly and would otherwise meet CI only on the release.
# The repository is public: the token is read-only and the job passes no secret, so a fork's pull request runs the
# same checks as the maintainers' own.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: skkuverse/.github/.github/workflows/checks.yml@285b8226d57b25c620521056c52cc0d7c685a917 # v1.0.1
    with:
      toolchain: node
      check-cmd: "npm run check:ci"
      public: true
