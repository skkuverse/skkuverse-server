name: CI

on:
  pull_request:
    # WHY: dev too: every change reaches dev by pull request, and main only takes the release merge from dev.
    branches: [main, dev]

# WHY: the repository is public. The token is read-only, and no step reads a secret, so a fork's pull request
# runs the same checks as the maintainers' own.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # WHY: mongodb-memory-server's postinstall downloads the mongod binary (~100 MB) during `npm ci`,
    # into this directory, which the cache step below restores, so a run downloads it only when
    # `config.mongodbMemoryServer.version` in package.json changes. Tests never download it.
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      # WHY: full history: the architecture tests compare the allowlists, exemptions and ratchets
      # with the PR base's (git merge-base), and a shallow clone has no base to compare with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # WHY: no step pushes or calls the API, so the token is not left in .git/config for the code under test.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: mongod version
        id: mongod
        run: echo "version=$(node -p "require('./package.json').config.mongodbMemoryServer.version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.mongod.outputs.version }}
      # WHY: firewall-version is pinned because its default, `latest`, downloads whatever sfw-free released last.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: 1.15.6
      - run: sfw npm ci
      # WHY: the postinstall exits 0 when its download fails, so without this a failed download
      # passes `npm ci` and surfaces later as four test files that cannot find a binary.
      - name: mongod binary present
        env:
          MONGOD_VERSION: ${{ steps.mongod.outputs.version }}
        run: |
          ls "$MONGOMS_DOWNLOAD_DIR"/mongod-*-"$MONGOD_VERSION" > /dev/null \
            || { echo "::error::no mongod $MONGOD_VERSION in $MONGOMS_DOWNLOAD_DIR: the npm ci download failed"; exit 1; }
      - run: npm run typecheck
      - run: npm run build
      # The vendored files (src/notices/*.json and the others in .contracts.lock.json) still match the lock: a
      # hand edit, a partial copy, or a codegen copy that landed without a lock update fails here. Offline: it
      # compares against this repo's own lock. After `npm run build`, so a vendored JSON missing from
      # scripts/copy-build-assets.js (in src/, absent from dist/, the container dies at boot) fails the same run.
      # WHY: the checker and the conventions linter are vendored too (.github/contract-tools/, hash-locked like
      # the rest), because a fork's pull request gets no secret to clone the repo that owns them. ubuntu-latest
      # ships python3 and both are stdlib-only, so no setup step.
      - name: Contract integrity
        run: python3 .github/contract-tools/exported/sync_contracts.py check --repo server --root .
      # `language` is left out until docs/ is English; the two rules this repo already satisfies stay gated.
      - name: Conventions
        run: |
          python3 .github/contract-tools/exported/lint_conventions.py --root . \
            --only frontmatter --only structure
      - run: npm test
      - run: npm run lint
      - run: npm run knip
      - run: npm run depcheck

  # WHY: a workflow runs with this repository's token, so a change to one gets two linters. actionlint checks the
  # syntax and the expressions. zizmor checks for the unsafe patterns: an untrusted trigger, an expression pasted
  # into a script, a checkout that leaves its token in .git/config. A finding fails the job unless its line
  # carries `# zizmor: ignore[<rule>]` and a reason.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # WHY: no step pushes or calls the API, so the token is not left in .git/config.
          persist-credentials: false
      # WHY: each tool is pinned by version and by the sha256 of its release archive, as the actions above are
      # pinned by commit: an archive fetched without a checksum is whatever the URL serves that day. Dependabot
      # does not see a download, so a bump changes the version and its checksum together, from the release page.
      - name: Install actionlint and zizmor
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          fetch() {
            curl --fail --silent --show-error --location --retry 3 --output "$1" "$2"
            echo "$3  $1" | sha256sum --check
          }
          fetch actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          fetch zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" "$ZIZMOR_SHA256"
          mkdir lint-bin
          tar --extract --gzip --file actionlint.tar.gz --directory lint-bin actionlint
          tar --extract --gzip --file zizmor.tar.gz --directory lint-bin zizmor
          echo "$RUNNER_TEMP/lint-bin" >> "$GITHUB_PATH"
      - run: actionlint
      # WHY: --offline skips the audits that call the GitHub API, which need a token this job does not hold.
      - run: zizmor --offline .github/workflows/
