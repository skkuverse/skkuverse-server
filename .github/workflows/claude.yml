name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

# WHY: Claude reads text that outsiders wrote (an issue, a fork's pull request and its code), so a reply can
# carry a prompt injection. Whatever token sits in the job is what an injection could make Claude echo.
# QUIRK(claude-code-action): the action writes its token into .git/config's origin URL in every mode, and
# passes `--permission-mode acceptEdits` ahead of claude_args. So each lock below is a deny list, and the
# action is pinned to a commit: a tool added upstream arrives here as a reviewed diff.
env:
  CLAUDE_READ_TOOLS: >-
    --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*)"
  # The token in .git/config stays unread: no file tool reaches .git/, and no git form that writes a file
  # (--output) or reads one outside the history (--no-index, blame --contents) is allowed.
  CLAUDE_GIT_LOCK: >-
    --disallowedTools "Read(.git/**),Edit(.git/**),Write(.git/**),Bash(*--output*),Bash(*--no-index*),Bash(*--contents*)"
  CLAUDE_READ_ONLY_LOCK: >-
    --permission-mode default
    --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*),Bash(*git-push.sh*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"

jobs:
  # WHY: the repository is public and the jobs below hold CLAUDE_CODE_OAUTH_TOKEN, so nothing starts unless a
  # maintainer asked; anyone else's `@claude` starts nothing. An issue comment runs in this repository's context,
  # with its secrets, even when it sits on a fork's pull request; a review or review comment there runs without
  # them, so it is skipped instead of failing. `read` and `edit` need this job, so they are skipped with it.
  mode:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && !github.event.pull_request.head.repo.fork && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && !github.event.pull_request.head.repo.fork && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # `@claude …` is read-only: read code, run read-only git/gh, comment.
      # `@claude edit …` may also edit, commit and push.
      - name: Choose mode
        id: mode
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          ASSOCIATION: ${{ github.event.comment.author_association || github.event.review.author_association }}
        run: |
          mode="read"
          opt_in='(^|[[:space:]])@claude[[:space:]]+edit([^[:alnum:]_-]|$)'
          if [[ "$BODY" =~ $opt_in ]]; then
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) mode="edit" ;;
              *) echo "::notice::@claude edit needs OWNER, MEMBER or COLLABORATOR; running read-only" ;;
            esac
          fi
          echo "Claude mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # WHY: read mode runs on this job's own token, which cannot push and expires with the job, instead of the
  # action's GitHub App token, which can. With no `id-token: write`, the job cannot mint that App token either.
  read:
    needs: mode
    if: needs.mode.outputs.mode == 'read'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855 # v1.0.249
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            ${{ env.CLAUDE_READ_TOOLS }}
            ${{ env.CLAUDE_GIT_LOCK }}
            ${{ env.CLAUDE_READ_ONLY_LOCK }}

  # WHY: edit mode pushes, so it takes the action's GitHub App token (minted through `id-token: write`), and
  # only a maintainer's `@claude edit` reaches it.
  edit:
    needs: mode
    if: needs.mode.outputs.mode == 'edit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855 # v1.0.249
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            ${{ env.CLAUDE_READ_TOOLS }}
            ${{ env.CLAUDE_GIT_LOCK }}
