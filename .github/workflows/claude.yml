name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

# WHY: Claude reads text that outsiders wrote (an issue, a fork's pull request and its code), so a reply can
# carry a prompt injection. Whatever token sits in the job is what an injection could make Claude echo.
# QUIRK(claude-code-action): the action writes its token into .git/config's origin URL in every mode, and
# passes `--permission-mode acceptEdits` ahead of claude_args. So each lock below is a deny list, and the
# action is pinned to a commit: a tool added upstream arrives here as a reviewed diff.
env:
  CLAUDE_READ_TOOLS: >-
    --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*)"
  # The tokens stay unread: no file tool reaches .git/ or the credentials file actions/checkout v6+ keeps
  # in RUNNER_TEMP, and no git form that writes a file (--output) or reads one outside the history is allowed.
  # `git diff` and `git blame` are out entirely: `git diff /dev/null <file>` and `blame -S <file>` read any file.
  CLAUDE_GIT_LOCK: >-
    --disallowedTools "Read(.git/**),Edit(.git/**),Write(.git/**),Read(//home/runner/work/_temp/git-credentials-*),Bash(git diff:*),Bash(git blame:*),Bash(*--output*),Bash(*--no-index*),Bash(*--contents*)"
  CLAUDE_READ_ONLY_LOCK: >-
    --permission-mode default
    --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*),Bash(*git-push.sh*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"

jobs:
  # WHY: Claude runs on this job's own token, which cannot push and expires with the job. Without the OIDC
  # permission the job cannot mint the action's GitHub App token, which can push.
  read:
    # WHY: the repository is public and this job holds CLAUDE_CODE_OAUTH_TOKEN, so the check sits on the job:
    # an issue comment runs with this repository's secrets even on a fork's pull request. A review or review
    # comment there runs without them, so it is skipped instead of failing.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && !github.event.pull_request.head.repo.fork && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && !github.event.pull_request.head.repo.fork && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            ${{ env.CLAUDE_READ_TOOLS }}
            ${{ env.CLAUDE_GIT_LOCK }}
            ${{ env.CLAUDE_READ_ONLY_LOCK }}
